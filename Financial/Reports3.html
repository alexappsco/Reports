<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10">

    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Generate New Report</h2>
            <button class=" hover:text-gray-600 "><img src="close.svg" alt=""></button>
        </div>
        <p class="text-gray-500 text-sm mb-8">Create custom reports with advanced filtering</p>

        <div class="flex justify-between items-center mb-10 px-2">
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">01</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Type</span>
            </div>
            <div class="flex-1 h-0.5 bg-[#495AFF] mx-2"></div>
            
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">02</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Filters</span>
            </div>
            <div class="flex-1 h-0.5 bg-[#495AFF] mx-2"></div>

            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] text-[#495AFF] flex items-center justify-center font-bold bg-white">03</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Output</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-200 mx-2"></div>

            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-gray-300 text-gray-400 flex items-center justify-center">04</div>
                <span class="mt-2 text-xs text-gray-400">Generate</span>
            </div>
        </div>

        <h3 class="text-lg font-bold text-gray-800 mb-1">Output Settings</h3>
        <p class="text-gray-500 text-sm mb-8">Configure report output format and details</p>

        <div class="space-y-6 mb-12">
            <div>
                <label class="block text-sm font-bold text-[#083A50] mb-2">
                    Report Name <span class="text-red-500">*</span>
                </label>
                <input type="text" placeholder="e.g. Monthly Financial Report" 
                    class="w-full border border-gray-200 rounded-xl p-4 text-sm focus:outline-none focus:border-[#495AFF] placeholder-gray-300">
            </div>

            <div>
                <label class="block text-sm font-bold text-[#083A50] mb-2">Description / Notes</label>
                <textarea placeholder="Add any Description / Notes for this Report..." rows="4"
                    class="w-full border border-gray-200 rounded-xl p-4 text-sm focus:outline-none focus:border-[#495AFF] placeholder-gray-300 resize-none"></textarea>
            </div>
        </div>

        <div class="flex justify-between items-center border-t pt-5">
            <button class="text-sm font-bold text-gray-800">Back</button>
            <div class="flex gap-3">
                <button class="px-7 py-2.5 border border-[#FF5F57] text-[#FF5F57] rounded-xl text-sm font-bold hover:bg-red-50 transition">Cancel</button>
                <button class="px-7 py-2.5 bg-[#F1A68E] text-white rounded-xl text-sm font-bold hover:bg-[#e89073] transition shadow-sm">Next</button>
            </div>
        </div>
    </div>

</body>
</html>
