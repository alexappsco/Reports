<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10">

    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Generate New Report</h2>
            <button class=" hover:text-gray-600 "><img src="close.svg" alt=""></button>
        </div>
        <p class="text-gray-500 text-sm mb-8">Create custom reports with advanced filtering</p>

        <div class="flex justify-between items-center mb-10 px-2">
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">01</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Type</span>
            </div>
            <div class="flex-1 h-0.5 bg-[#495AFF] mx-2"></div>
            
            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">02</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Filters</span>
            </div>
            <div class="flex-1 h-0.5 bg-[#495AFF] mx-2"></div>

            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">03</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Output</span>
            </div>
            <div class="flex-1 h-0.5 bg-[#495AFF] mx-2"></div>

            <div class="flex flex-col items-center flex-1">
                <div class="w-10 h-10 rounded-full border-2 border-[#495AFF] bg-[#495AFF] text-white flex items-center justify-center font-bold">04</div>
                <span class="mt-2 text-xs font-semibold text-[#495AFF]">Generate</span>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center py-10 text-center">
            <div class=" flex items-center justify-center mb-6 ">
                <img src="true.svg" alt="true"/>
            </div>
            <h3 class="text-xl text-gray-500 mb-2">Report Generated Successfully!</h3>
            <p class="text-gray-500 text-sm mb-8">Your report is ready to view or download</p>

            <div class="flex gap-4">
                <button class="px-6 py-2.5 border-2 border-gray-200 text-gray-700 rounded-xl text-sm font-bold hover:bg-gray-50 transition">Back To Report</button>
                <button class="px-6 py-2.5 bg-[#F1A68E] text-white rounded-xl text-sm font-bold hover:bg-[#e89073] transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    Preview
                </button>
            </div>
        </div>
    </div>
</body>
</html>
